name: Publish add-on images

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "CHANGELOG.md"
      - "config.yaml"
      - "run.sh"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.arch }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base:latest
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:latest
          - arch: armv7
            platform: linux/arm/v7
            base: ghcr.io/home-assistant/armv7-base:latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read and validate Vortex UI version
        id: version
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' config.yaml)"
          if [[ ! "$version" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid add-on version '$version'. Expected YYYY.M.PATCH without a v prefix."
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push add-on image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            VORTEX_UI_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/xsalegg/addon-vortex-ui-${{ matrix.arch }}:latest
            ghcr.io/xsalegg/addon-vortex-ui-${{ matrix.arch }}:${{ steps.version.outputs.value }}
